<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #040711;
            --panel-bg: rgba(8, 17, 36, 0.94);
            --cyan: #00f3ff;
            --cyan-glow: rgba(0, 243, 255, 0.4);
            --cyan-dim: rgba(0, 243, 255, 0.15);
            --text-main: #d8f8ff;
            --text-muted: #5b8fa8;
            --green-ok: #00ff9d;
            --amber: #ffae00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.06) 0%, transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.025) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 15px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--cyan);
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
            position: relative;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--cyan-dim);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stark-reactor-box {
            width: 52px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            filter: drop-shadow(0 0 10px var(--cyan-glow));
        }

        .title-block h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
            font-size: 0.75rem;
            color: var(--green-ok);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green-ok);
            box-shadow: 0 0 6px var(--green-ok);
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding-top: 10px;
            font-size: 0.75rem;
        }

        .tele-item span.label {
            display: block;
            color: var(--text-muted);
            font-size: 0.62rem;
            margin-bottom: 2px;
        }

        .tele-item span.val {
            color: var(--cyan);
            font-weight: bold;
            font-size: 0.85rem;
        }

        .tele-clock { text-align: right; }
        .tele-clock .time {
            font-family: 'Orbitron', sans-serif;
            color: var(--amber);
            font-size: 0.9rem;
            font-weight: bold;
        }
        .tele-clock .loc {
            color: var(--text-muted);
            font-size: 0.62rem;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 1.2px;
            color: var(--cyan);
        }

        .badge {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.68rem;
            padding: 2px 6px;
            border: 1px solid var(--cyan);
            border-radius: 4px;
            color: var(--green-ok);
            background: rgba(0, 243, 255, 0.08);
        }

        .radar-box {
            height: 160px;
            background: radial-gradient(circle, rgba(0, 45, 70, 0.5) 0%, rgba(3, 9, 20, 0.95) 80%);
            border: 1px solid var(--cyan-dim);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.06) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .radar-circle {
            position: absolute;
            border: 1px solid rgba(0, 243, 255, 0.25);
            border-radius: 50%;
        }
        .c1 { width: 50px; height: 50px; }
        .c2 { width: 100px; height: 100px; }
        .c3 { width: 150px; height: 150px; }

        .radar-center {
            width: 7px;
            height: 7px;
            background: var(--amber);
            border-radius: 50%;
            z-index: 2;
        }

        .orbital-box {
            height: 160px;
            background: rgba(3, 8, 18, 0.95);
            border: 1px solid var(--cyan-dim);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        canvas#orbitalCanvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

<div class="hud-container">
    <div class="panel">
        <div class="header-top">
            <div class="header-left">
                <div class="stark-reactor-box">
                    <svg width="48" height="44" viewBox="0 0 100 92" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="6,8 94,8 50,86" fill="#061224" stroke="currentColor" stroke-width="4" style="color: var(--cyan);"/>
                        <polygon points="30,22 70,22 50,58" fill="currentColor" style="color: var(--cyan);"/>
                    </svg>
                </div>
                <div class="title-block">
                    <h1>J.A.R.V.I.S. HUD</h1>
                    <div class="status-line">
                        <div class="status-dot"></div>
                        <span>EN LÍNEA // NODO BUIN</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="telemetry-grid">
            <div class="tele-item"><span class="label">CPU NÚCLEO</span><span class="val" id="cpuVal">27%</span></div>
            <div class="tele-item"><span class="label">MEMORIA RAM</span><span class="val" id="ramVal">4.2 GB</span></div>
            <div class="tele-item"><span class="label">REACTOR ARC</span><span class="val" id="reactorOut">3.2 GJ/s</span></div>
            <div class="tele-clock">
                <div class="time" id="hudClock">10:56:00</div>
                <div class="loc">CHILE (UTC-3)</div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header"><span>MAPA TÁCTICO SATELITAL</span><span class="badge">● NODO BUIN</span></div>
        <div class="radar-box">
            <div class="radar-grid"></div>
            <div class="radar-circle c1"></div>
            <div class="radar-circle c2"></div>
            <div class="radar-circle c3"></div>
            <div class="radar-center"></div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header"><span>MAPA ORBITAL DE PROYECTOS</span><span class="badge">5 NODOS</span></div>
        <div class="orbital-box"><canvas id="orbitalCanvas"></canvas></div>
    </div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        const clockEl = document.getElementById('hudClock');
        if (clockEl) {
            clockEl.textContent = now.toTimeString().split(' ')[0];
        }
    }
    setInterval(updateClock, 1000);
    updateClock();

    const canvas = document.getElementById('orbitalCanvas');
    const ctx = canvas.getContext('2d');
    let nodes = [
        { name: 'J.A.R.V.I.S.', rx: 55, ry: 20, angle: 0.3, speed: 0.016, color: '#ffae00' },
        { name: 'Agente IA', rx: 90, ry: 32, angle: 1.8, speed: 0.012, color: '#00ff9d' },
        { name: 'Isla Números', rx: 125, ry: 44, angle: 3.4, speed: 0.009, color: '#00f3ff' }
    ];

    function resizeCanvas() {
        if (!canvas.parentElement) return;
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawOrbitals() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = canvas.width / 2, cy = canvas.height / 2;
        nodes.forEach(n => {
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.22)';
            ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(cx, cy, n.rx, n.ry, 0, 0, Math.PI * 2); ctx.stroke();
            n.angle += n.speed;
            const nx = cx + Math.cos(n.angle) * n.rx, ny = cy + Math.sin(n.angle) * n.ry;
            ctx.fillStyle = n.color;
            ctx.beginPath(); ctx.arc(nx, ny, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#d8f8ff'; ctx.font = '10px monospace'; ctx.fillText(n.name, nx + 7, ny + 3);
        });
        requestAnimationFrame(drawOrbitals);
    }
    drawOrbitals();
</script>
</body>
</html>
